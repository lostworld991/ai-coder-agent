app:
  name: ai-coder-agent
services:
  - name: ai-coder
    type: web
    ports:
      - port: 8080
    routes:
      - path: /
        port: 8080
    health_check:
      http:
        path: /health
        port: 8080
    regions: [fra]
    scaling:
      min: 1
      max: 3
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
    volumes:
      - name: settings
        mount_path: /app/settings
        size: 1
